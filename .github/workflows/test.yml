name: Contract verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gltest-direct
            ~/.cache/genvm-linter
          key: genvm-0.2.16-linter-0.11.0
      - run: pytest -q
      - run: genvm-lint check contracts/permit_gate.py
      - run: genvm-lint typecheck contracts/permit_gate.py
      - run: genvm-lint schema contracts/permit_gate.py
